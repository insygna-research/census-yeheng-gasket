[package]
name = "conga-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
conga = { workspace = true }
dotenvy = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
anyhow = { workspace = true, optional = true }

# ---- built-in tools (host-level since the module move) ----
# Gitignore-aware directory walking (list + grep tools). Bundles `walkdir` +
# `globset`, so we no longer depend on `walkdir` directly.
ignore = "0.4"
# Glob matching (list tool)
glob = "0.3"
# Regex matching (grep tool)
regex = "1"
# HTML parsing for the fetch tool + URL handling
dom_query = "0.28"
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Opt-in Landlock backend for the bash tool (CONGA_SANDBOX=1).
landlock = { version = "0.4", optional = true }

[features]
session-index = ["dep:rusqlite", "dep:anyhow"]
# Opt-in Linux sandbox backend; macOS (sandbox-exec) needs no dependency.
sandbox-landlock = ["dep:landlock"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
futures-util = { workspace = true }
parking_lot = { workspace = true }
# .env loading for example hosts.
dotenvy = { workspace = true }
# Example host uses the real extension crate (same register shape as production).
conga-ext = { path = "../conga-ext" }

[[example]]
name = "cli_host"
