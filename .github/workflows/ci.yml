name: CI

on:
  push:
    branches: [main]
    paths:
      - 'conga/**'
      - 'web/src/**'
      - 'web/src-tauri/**'
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'conga/**'
      - 'web/src/**'
      - 'web/src-tauri/**'
      - 'web/package.json'
      - 'web/pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conga/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('conga/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cd conga && cargo fmt --all -- --check

      - name: Run clippy
        run: cd conga && cargo clippy --all-features -- -D warnings

      - name: Run tests
        run: cd conga && cargo test --all-features

  build:
    name: Build (Rust)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conga/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('conga/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cd conga && cargo build --release --all-features

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: conga-linux
          path: conga/target/release/conga

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conga/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('conga/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cd conga && cargo build --release --all-features

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: conga-macos
          path: conga/target/release/conga

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conga/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('conga/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cd conga && cargo build --release --all-features

      - name: Package binary
        run: |
          cd conga/target/release
          Compress-Archive -Update -Path conga.exe -DestinationPath conga-windows.zip

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: conga-windows
          path: conga/target/release/conga-windows.zip

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Type-check (vue-tsc)
        run: pnpm vue-tsc -b --noEmit
        working-directory: web

      - name: Build (vite)
        run: pnpm build
        working-directory: web

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
