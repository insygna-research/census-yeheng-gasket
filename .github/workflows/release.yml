name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: cd gasket && cargo build --release --target ${{ matrix.target }} --all-features
      
      - name: Package (Linux/macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          cd gasket/target/${{ matrix.target }}/release
          tar -czvf gasket-${{ matrix.target }}.tar.gz gasket

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd gasket/target/${{ matrix.target }}/release
          7z a gasket-${{ matrix.target }}.zip gasket.exe

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: gasket/target/${{ matrix.target }}/release/gasket-${{ matrix.target }}.${{ matrix.archive }}

  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Tauri build
        run: pnpm tauri build ${{ matrix.args }}
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gasket-desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            web/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            web/src-tauri/target/release/bundle/**/*.dmg
            web/src-tauri/target/release/bundle/**/*.msi
            web/src-tauri/target/release/bundle/**/*.exe
