[package]
name = "gasket-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gasket"
path = "src/main.rs"

[dependencies]
gasket-host = { workspace = true }
gasket-core = { workspace = true }
gasket-ext = { workspace = true, optional = true }
reedline = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Link optional in-process extensions (hello / todo / permission_gate),
# plus the terminal PTY tool (forwarded feature).
ext = ["dep:gasket-ext", "gasket-ext?/terminal"]
