
[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["gasket contributors"]
repository = "https://github.com/YeHeng/gasket"
keywords = ["ai", "agent", "chatbot", "llm"]
description = "A lightweight personal AI assistant framework"

[workspace]
resolver = "2"
members = [
    "gasket-core",
    "gasket-host",
    "gasket-cli",
    "gasket-ext",
    "gasket-gateway",
]

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[workspace.dependencies]
# Internal crates
gasket-core = { path = "gasket-core" }
gasket-host = { path = "gasket-host" }
gasket-ext = { path = "gasket-ext" }

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "time",
    "fs", "io-util", "net", "process", "signal",
] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures = "0.3"
futures-util = "0.3.32"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
dirs = "6"
directories = "6"
dotenvy = "0.15"

# Time
chrono = { version = "0.4", features = ["serde"] }

# File watcher
notify = "8"

# YAML
serde_yaml = "0.9"

# UUID
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# HTTP server (for webhooks)
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }

# Terminal
colored = "3"

# REPL
reedline = "0.49"
nu-ansi-term = "0.50"

# Concurrent data structures
dashmap = "6"

# Test utilities
tempfile = "3"
