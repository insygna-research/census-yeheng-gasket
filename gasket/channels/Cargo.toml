[package]
name = "gasket-channels"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Messaging channel abstractions and implementations for gasket"

[features]
# Platform adapter implementations were removed in the V0.1 refactor.
# Only core channel types (SessionKey/ChannelType/InboundMessage/OutboundMessage,
# adapter trait, middleware, provider registry) remain.

[dependencies]
# Internal crates
gasket-types = { path = "../types" }
gasket-broker = { workspace = true }

# Async
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# HTTP (for stateless senders)
reqwest.workspace = true

# Time
chrono.workspace = true

# Logging
tracing.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# UUID
uuid.workspace = true

# URL encoding
urlencoding = "2.1"

# Base64
base64 = "0.22"
bytes = "1"

# Concurrent map (used by approval_router core)
dashmap = "6.1"


