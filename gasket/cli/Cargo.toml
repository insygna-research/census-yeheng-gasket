[package]
name = "gasket-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI for gasket AI assistant"

[[bin]]
name = "gasket"
path = "src/main.rs"

[features]
default = ["markdown"]

# Rendering
markdown = ["termimad"]

# Telemetry (optional, for production/debugging)
telemetry = ["tracing-opentelemetry", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]

# Channel adapters (telegram/discord/slack/feishu/wechat/websocket) were removed
# in the V0.1 refactor — they belong in plugins now.

# Providers
provider-anthropic = ["gasket-engine/provider-anthropic"]
provider-gemini = ["gasket-engine/provider-gemini"]
provider-copilot = ["gasket-engine/provider-copilot"]
provider-minimax = ["gasket-engine/provider-minimax"]
provider-moonshot = ["gasket-engine/provider-moonshot"]
all-providers = ["provider-anthropic", "provider-gemini", "provider-copilot", "provider-minimax", "provider-moonshot"]

# Embedding
embedding = ["gasket-engine/embedding"]

# Workspace template download (now in CLI, not core)
workspace-download = ["dep:tar", "dep:flate2"]

# Full build (all optional features enabled)
full = ["default", "all-providers", "workspace-download", "telemetry", "embedding"]

[dependencies]
gasket-engine = { path = "../engine" }
gasket-storage = { path = "../storage" }
gasket-sandbox = { path = "../sandbox" }
gasket-types = { path = "../types" }
gasket-command = { path = "../command" }
gasket-channels = { path = "../channels" }
gasket-broker = { path = "../broker" }

# Async
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true

# CLI
clap.workspace = true

# Logging & Tracing
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

# Error handling
anyhow.workspace = true

# Serialization
serde_json.workspace = true

# Time
chrono.workspace = true

# Configuration
dirs.workspace = true

# Terminal
colored.workspace = true

# Interactive CLI
dialoguer.workspace = true

# REPL
reedline.workspace = true
nu-ansi-term.workspace = true

# Cron (for validating cron expressions)
cron.workspace = true

# UUID
uuid.workspace = true

# Markdown rendering (optional)
termimad = { workspace = true, optional = true }

# TLS
rustls.workspace = true

# HTTP client (for workspace downloads)
reqwest.workspace = true

# Archive extraction (for workspace template downloads)
tempfile = "3"
tar = { version = "0.4", optional = true }
flate2 = { version = "1.0", optional = true }

# SQLite (for search commands)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }


