[package]
name = "gasket-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pi-style pluggable agent core for gasket"

[lib]
name = "gasket_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging & Tracing
tracing = { workspace = true }

# HTTP client (providers)
reqwest = { workspace = true }

# Async utilities
futures-util = { workspace = true }
async-stream = "0.3"

# IDs
uuid = { workspace = true }

# Home/config dir lookup
dirs = { workspace = true }

# Gitignore-aware directory walking (list + grep tools). Bundles `walkdir` +
# `globset`, so we no longer depend on `walkdir` directly.
ignore = "0.4"

# Glob matching (list tool)
glob = "0.3"

# Regex matching (grep tool)
regex = "1"
# HTML parsing for the fetch tool
dom_query = "0.28"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true }
tempfile = "3"
# .env loading for example hosts (the library itself stays process-env-only).
dotenvy = "0.15"
# Example host uses the real extension crate (same register shape as production).
gasket-ext = { path = "../gasket-ext" }
